<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLANILHA — editor</title>
  <script>
    (() => { const t = localStorage.getItem('planilha-tema'); if (t) document.documentElement.dataset.theme = t; })();
  </script>

  <!-- Luckysheet (CDN). A versão é fixada em js/config.js e injetada abaixo. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css">

  <!-- Nosso tema (depois do Luckysheet, para sobrescrever) -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/luckysheet-blue.css">
</head>
<body>

  <!-- ============ TOPO DO EDITOR ============ -->
  <header class="editor-topbar">
    <button class="btn btn-icone" id="btn-voltar" title="Voltar ao painel">←</button>
    <span class="marca" style="font-weight:800">▦</span>
    <input class="titulo-planilha" id="titulo-planilha" value="Planilha" aria-label="Nome da planilha" disabled>
    <span class="status" id="status-salvar"></span>
    <div class="espaco"></div>
    <button class="btn btn-salvar" id="btn-salvar">Salvar</button>
    <button class="btn btn-salvar oculto" id="btn-compartilhar">👥 Compartilhar</button>
    <button class="btn btn-icone" id="btn-logout" title="Sair">⎋</button>
  </header>

  <!-- ============ GRADE (Luckysheet) ============ -->
  <div id="luckysheet"></div>

  <div id="toasts"></div>

  <!-- Scripts do Luckysheet (versão local com dependências de gráfico trocadas p/ vendor/) -->
  <script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/js/plugin.js"></script>
  <script src="luckysheet.umd.local.js"></script>

  <!-- Nosso editor -->
  <script type="module" src="js/editor.js"></script>
</body>
</html>
